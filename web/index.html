<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="maze_runner_windows">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>maze_runner_windows</title>
  <link rel="manifest" href="manifest.json">

  <!--
    flutter_angle needs this JS shim to define the global `glCanvas()`
    helper that three_js uses to create a WebGL2 rendering context.
    Without it, any 3D view on the web silently stalls with
    "TypeError: dart.global.glCanvas is not a function".
    Source: flutter_angle package README.
  -->
  <script src="https://cdn.jsdelivr.net/gh/Knightro63/flutter_angle/assets/gles_bindings.js"></script>

  <script src="flutter.js" defer></script>
</head>
<body>
  <script src="wasm/maze.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
